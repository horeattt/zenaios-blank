<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenAIos — Spital</title>
<style>
  :root {
    --bg: #f5f5f5;
    --surface: #fff;
    --nav: #faf9f8;
    --border: #edebe9;
    --text: #242424;
    --text-2: #605e5c;
    --text-3: #8a8886;
    --accent: #0078d4;
    --accent-hover: #106ebe;
    --accent-ink: #0f548c;
    --accent-soft: #eff6fc;
    --ok: #0e700e;
    --ok-bg: #f1faf1;
    --warn: #8a6116;
    --warn-bg: #fff4ce;
    --bad: #a4262c;
    --bad-bg: #fde7e9;
    --neutral: #f3f2f1;
    --shadow: 0 1.6px 3.6px rgba(0,0,0,.06), 0 .3px .9px rgba(0,0,0,.04);
    --font: "Segoe UI", "Segoe UI Variable Text", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .shell { display: flex; height: 100vh; min-width: 1080px; }
  .sidebar { width: 240px; flex: 0 0 240px; background: var(--nav); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
  .mark { width: 32px; height: 32px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 600; }
  .brand b { display: block; font-size: 15px; }
  .brand span { font-size: 12px; color: var(--text-2); font-weight: 400; }
  .nav-scroll { flex: 1; overflow: auto; padding: 8px 0 12px; }
  .nav-label { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: var(--text-2); padding: 12px 10px 4px 16px; }
  .nav-plus { margin-left: auto; width: 22px; height: 22px; border: 1px solid #c8c6c4; border-radius: 4px; background: #fff; color: var(--accent-ink); font-size: 16px; line-height: 1; }
  .nav-plus:hover { background: var(--accent-soft); }
  button.brand { width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; }
  .nav-item { display: flex; align-items: center; gap: 8px; width: calc(100% - 16px); margin: 1px 8px; padding: 7px 10px; border: 0; border-radius: 4px; background: transparent; text-align: left; font-size: 13px; }
  .nav-item:hover { background: #f3f2f1; }
  .nav-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .nav-item svg { width: 16px; height: 16px; flex: 0 0 16px; }
  .sidebar-foot { border-top: 1px solid var(--border); padding: 12px 16px; }
  .user { display: flex; gap: 10px; align-items: center; }
  button.user-btn { width: 100%; border: 0; background: transparent; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  button.user-btn:hover b, button.user-btn.on b { color: var(--accent-ink); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #e1dfdd; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .user b { display: block; font-size: 13px; }
  .user span, .quiet { color: var(--text-2); font-size: 12px; }
  .linkish { border: 0; background: none; color: var(--text-2); font-size: 12px; padding: 8px 0 0; }
  .linkish:hover { color: var(--accent-ink); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 56px; flex: 0 0 56px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; padding: 0 20px; }
  .topbar.patient { height: auto; flex: 0 0 auto; align-items: flex-start; padding: 10px 16px 12px; }
  .top-side { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; }
  .topbar.patient .pid { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .pid-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .topbar.patient h1 { font-size: 22px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .pid-main .rest { font-size: 14px; color: var(--text-2); }
  .pid-main .dx { color: var(--text); font-weight: 600; }
  .pid-meta { font-size: 13px; color: var(--text-2); line-height: 1.45; }
  .pid-main .sep, .pid-meta .sep { color: #c8c6c4; }
  .pid-meta .allergy { color: var(--bad); font-weight: 600; }
  .chart-dash .dx-line { margin: 0 0 6px; font-weight: 600; }
  .topbar.board { height: auto; flex: 0 0 auto; flex-direction: column; align-items: stretch; gap: 8px; padding: 8px 16px 10px; background: #d9ebf8; border-bottom-color: #c5dff0; }
  .topbar.board .back:hover { background: #c5dff3; }
  .board-line { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .board-line.sub { flex-wrap: wrap; }
  .topbar.board .title { flex: 0 1 auto; }
  .topbar.board .search { flex: 1 1 520px; min-width: 420px; max-width: 640px; height: 40px; }
  .topbar.board .search input[type="text"] { height: 40px; font-size: 15px; line-height: 40px; }
  .doc-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 12px; }
  .doc-card { display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 12px 14px; background: #fff; border: 1px solid var(--border); border-radius: 8px; text-align: left; box-shadow: var(--shadow); cursor: pointer; }
  .doc-card:hover { border-color: #8a8886; }
  .doc-card.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .doc-dot { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 16px; background: #8a8886; }
  .doc-card.on .doc-dot { background: var(--accent); }
  .doc-copy { flex: 1; min-width: 0; }
  .doc-copy b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-copy span { display: block; margin-top: 2px; font-size: 12px; color: var(--text-2); font-weight: 400; }
  .doc-n { font-size: 22px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
  .pill { border: 0; border-radius: 4px; height: 28px; padding: 0 10px; font-size: 12px; font-weight: 600; }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.warn { background: var(--warn-bg); color: #6b4f12; }
  .topbar .title { min-width: 0; flex: 1; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumb { font-size: 12px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .context { font-size: 12px; color: var(--text-2); }
  .context strong { color: var(--text); font-weight: 600; }
  .content { flex: 1; overflow: auto; padding: 20px 24px 36px; }
  .content.ward-canvas, .content.sheet-canvas { background: #e5f4ea; }
  .ward-canvas .hpages { background: #e5f4ea; }
  .ward-canvas tbody tr.click:hover td { background: #d4eddc; }
  .lead { color: var(--text-2); font-size: 13px; margin: 0 0 16px; max-width: 760px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .wards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .block-label { font-size: 12px; font-weight: 600; color: var(--text-2); margin: 2px 0 8px; }
  .gauges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .gauge { background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
  button.gauge { width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  button.gauge.on, button.stat.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
  .gauge.warn { box-shadow: inset 3px 0 0 #ca8a04, var(--shadow); }
  .gauge.bad { box-shadow: inset 3px 0 0 var(--bad), var(--shadow); }
  .donut { --p: 70; --a: #e7f5eb; --b: #8fbf9c; width: 76px; height: 76px; flex: 0 0 76px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(from -90deg, var(--a), var(--b) calc(var(--p) * 1%), #f3f2f1 0); }
  .donut b { width: 56px; height: 56px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 600; letter-spacing: -.03em; }
  .donut.warn { --a: #fbf6e4; --b: #e4c56a; }
  .donut.bad { --a: #fdeeee; --b: #e8b4b4; }
  .donut.sm { width: 46px; height: 46px; flex: 0 0 46px; }
  .donut.sm b { width: 34px; height: 34px; font-size: 9px; }
  .ward-card { display: flex; flex-direction: column; align-items: stretch; overflow: hidden; }
  .ward-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 4px 0 10px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .kpi-cell { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 7px; border-right: 1px solid var(--border); background: linear-gradient(180deg, #f7fbf8, #e7f4ea); }
  .kpi-cell:nth-child(2) { background: linear-gradient(180deg, #fffcf6, #f6efd8); }
  .kpi-cell:nth-child(3) { background: linear-gradient(180deg, #f7fbfe, #e6f1fb); }
  .kpi-cell:last-child { border-right: 0; background: linear-gradient(180deg, #fff8f8, #f7e4e4); }
  .kpi-cell em { font-style: normal; font-size: 10px; font-weight: 600; color: var(--text-2); line-height: 1.1; }
  .kpi-cell.bad em, .kpi-cell.bad b { color: #9a4a4e; }
  .kpi-frame { margin-bottom: 12px; }
  .kpi-frame .ward-kpis { margin: 0; border: 0; border-radius: 8px; }
  .gauge h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .gauge .read { font-size: 12px; font-weight: 600; margin: 2px 0 6px; }
  .gauge .read.ok { color: var(--ok); }
  .gauge .read.warn { color: var(--warn); }
  .gauge .read.bad { color: var(--bad); }
  .gauge .sec { font-size: 12px; color: var(--text-2); line-height: 1.45; }
  .gauge .sec b { color: var(--text); font-weight: 600; }
  .card, .stat, .ward-card, .study, .letter-sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
  .stat { padding: 14px 16px; }
  button.stat { display: block; width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .drill { background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); margin: 0 0 12px; overflow: hidden; }
  .drill-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .drill-head h2 { margin: 0; font-size: 14px; }
  .drill-head .chips { margin-left: auto; }
  .drill-row, .drill-sub { display: grid; grid-template-columns: minmax(160px, 220px) 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 10px 14px; border: 0; border-top: 1px solid var(--border); background: #fff; text-align: left; }
  .drill-sub { background: #faf9f8; padding-left: 28px; }
  .drill-fig { text-align: right; }
  .drill-fig b { display: block; font-size: 18px; font-weight: 600; }
  .drill-fig i { font-style: normal; font-size: 11px; color: var(--text-2); }
  .sheet-row { display: flex; gap: 16px; align-items: flex-start; }
  .sheet-main { flex: 1; min-width: 0; }
  .alert-rail { flex: 0 0 280px; width: 280px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0; }
  .zena { display: block; width: 100%; border: 1px solid transparent; border-radius: 8px; padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .zena-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .zena-h b { flex: 1; margin: 0; font-size: 13px; font-weight: 600; line-height: 1.3; }
  .zena-h svg { width: 14px; height: 14px; flex: 0 0 14px; color: var(--text-2); }
  .zena.open .zena-h svg { transform: rotate(180deg); }
  .zena-body { display: none; padding: 0 12px 12px; font-size: 12px; line-height: 1.4; }
  .zena.open .zena-body { display: block; }
  .zena-body span { display: block; }
  .zena-body span + span { margin-top: 6px; }
  .zena.bad { background: #fde7e9; border-color: #f4c7cb; }
  .zena.warn { background: #fff4ce; border-color: #f3e2a4; }
  .film-row { display: flex; gap: 14px; align-items: flex-start; }
  .film { width: 168px; height: 188px; flex: 0 0 168px; border-radius: 4px; background: #16181a; }
  .pareto-note { font-size: 12px; color: var(--text-2); margin: 0 0 10px; }
  .stat-label, .muted { color: var(--text-2); font-size: 12px; }
  .stat-value { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin-top: 4px; }
  .stat.attention { box-shadow: inset 3px 0 0 var(--bad), var(--shadow); }
  .stat.attention .stat-value { color: var(--bad); }
  .ward-card { padding: 16px; text-align: left; width: 100%; }
  .ward-card:hover { border-color: #c7c6c4; }
  .ward-card h2 { margin: 0 0 4px; font-size: 16px; }
  .mini { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 12px 0; }
  .mini i { display: block; height: 8px; border-radius: 2px; background: #e1dfdd; }
  .mini i.occ { background: #c7e0f4; }
  .mini i.ready { background: #f4d27a; }
  .mini i.closed { background: #c8c6c4; }
  body.clinic .sidebar { display: none; }
  .back { width: 32px; height: 32px; margin-right: 4px; border: 0; border-radius: 4px; background: transparent; color: var(--accent-ink); font-size: 18px; line-height: 1; }
  .back:hover { background: #f3f2f1; }
  .btn.on { background: var(--accent-soft); color: var(--accent-ink); }
  .stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat-grid .stat { padding: 10px 12px; }
  .stat-grid .stat-value { font-size: 20px; }
  .catalog { max-height: 240px; overflow: auto; border: 1px solid var(--border); border-radius: 4px; background: #fff; }
  .catalog button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: #fff; padding: 8px 12px; font-size: 13px; }
  .catalog button:hover { background: #faf9f8; }
  .split { display: grid; grid-template-columns: 1.15fr .85fr; gap: 12px; }
  .card-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .card-head h2 { margin: 0; font-size: 14px; }
  .card-head .sub { margin-left: auto; font-size: 12px; color: var(--text-2); }
  .card-body { padding: 16px; }
  .card-body.tight { padding: 0; }
  .msg { display: flex; gap: 10px; padding: 10px 12px; border-radius: 4px; background: var(--warn-bg); color: #323130; font-size: 13px; margin-bottom: 12px; }
  .msg.err { background: var(--bad-bg); }
  .msg.info { background: #f3f9fd; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .chips { display: flex; gap: 0; border: 1px solid #8a8886; border-radius: 4px; overflow: hidden; }
  .chips button { border: 0; border-right: 1px solid #d2d0ce; background: #fff; height: 32px; padding: 0 12px; font-size: 12px; font-weight: 600; }
  .chips button:last-child { border-right: 0; }
  .chips button.on { background: var(--accent-soft); color: var(--accent-ink); }
  .search { display: flex; align-items: center; min-width: 280px; flex: 1; max-width: 420px; height: 36px; }
  .beds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .salon h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  .salon h2 span { font-size: 12px; font-weight: 600; color: var(--text-2); }
  .salon-beds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bed { min-height: 88px; border: 1px solid var(--border); border-radius: 4px; background: #faf9f8; padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .bed:hover { border-color: #8a8886; }
  .bed-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .bed { width: 100%; }
  .patline { display: flex; align-items: baseline; justify-content: flex-start; gap: 8px; }
  .bed .patno { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
  .bed .no { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
  .bed .who { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bed .meta { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bed.occ { background: #fff; }
  .bed.dim { opacity: .38; }
  .salon { border-radius: 12px; padding: 12px 12px 14px; margin: 0 0 14px; }
  .salon.tone-0 { background: #d9ebf8; }
  .salon.tone-1 { background: #dcefe3; }
  .salon.tone-2 { background: #f8efd8; }
  .salon.tone-3 { background: #efe6f6; }
  .salon.tone-4 { background: #f8e4e4; }
  .salon h2 { color: #323130; }
  .salon .bed { background: rgba(255,255,255,.5); border-color: transparent; }
  .salon .bed.occ { background: #fff; border-color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .mag-menu { display: flex; gap: 0; margin: 0 0 12px; overflow-x: auto; background: #fff; border: 1px solid var(--border); border-radius: 8px; }
  .mag-menu button { border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--text-2); font-weight: 600; font-size: 14px; padding: 12px 16px; white-space: nowrap; }
  .mag-menu button.on { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .hpages { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 12px 0 0; position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 2px; z-index: 2; }
  .hpages .pg { min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--text-2); font-weight: 600; }
  .hpages .pg:hover { background: #fff; }
  .hpages .pg.on { background: #fff; border-color: var(--border); color: var(--accent-ink); box-shadow: var(--shadow); }
  .hpages .pg.cal { margin-left: 8px; color: var(--text-3); font-size: 12px; font-weight: 600; }
  .cal-pop { flex: 1 0 100%; max-width: 300px; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 10px 12px 8px; margin-top: 6px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-nav b { font-size: 13px; font-weight: 600; text-transform: capitalize; }
  .cal-nav button { width: 28px; height: 28px; border: 0; background: transparent; font-size: 18px; color: var(--text-2); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-grid span { font-size: 11px; color: var(--text-3); font-weight: 600; padding: 4px 0; }
  .cal-grid button { height: 28px; border: 0; border-radius: 4px; background: transparent; font-size: 12px; }
  .cal-grid button:hover { background: #f3f2f1; }
  .cal-grid button.mid { background: var(--accent-soft); }
  .cal-grid button.on { background: var(--accent); color: #fff; }
  .cal-pop .linkish { padding-top: 6px; }
  .nav-item.zena-entry { font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); margin-top: 4px; margin-bottom: 8px; }
  .ai-box { background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .ai-box .mic { width: 44px; height: 44px; }
  .zena-dock { position: fixed; z-index: 40; right: 0; top: 0; bottom: 0; display: flex; align-items: stretch; justify-content: flex-end; pointer-events: none; }
  .zena-dock > * { pointer-events: auto; }
  .zena-tab { position: absolute; right: 0; bottom: 28px; width: 26px; height: 92px; border: 0; border-radius: 8px 0 0 8px; background: #7eb6ea; color: #fff; box-shadow: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 0; }
  .zena-tab:hover { background: #0078d4; }
  .zena-tab span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; font-weight: 600; letter-spacing: .03em; }
  .zena-tab i { width: 9px; height: 9px; border: 1.5px solid #fff; border-radius: 50%; }
  .ai-wrap { max-width: 720px; margin: 0 auto; }

function zenaAnswer(q) {

  const p = patient();
  if (/program/.test(s)) return "Internarea se deschide de pe secție, cu butonul Internare, la un pat liber. Se completează numele, CNP-ul și diagnosticul.";
  if (/servici|secți/.test(s)) return "Secțiile deschise sunt Cardiologie, Chirurgie generală și Medicină internă. Fiecare are paturi, saloane, magazie și foaie.";
  if (/ajung|adres|unde este spital/.test(s)) return "În demonstrație spitalul este în Oradea. Adresa de pe foaie este a pacientului.";
  if (/list/.test(s) && w) return "Lista de pacienți este primul ecran al secției. Paginile numerotate schimbă internații, externările și istoricul.";
  if (/sub prag/.test(s) && w) {
    const low = (w.meds || []).filter(m => m.qty < m.min).map(m => m.name).concat((w.stock || []).filter(m => m.qty < m.min).map(m => m.name));
    return low.length ? "Sub prag: " + low.join(", ") + "." : "Pe această secție nimic nu este sub prag.";
  }
  if (/liber/.test(s) && w) return `Pe ${w.name} sunt ${freeBeds(w).length} paturi libere din ${bedCount(w)}.`;
  if (/critic/.test(s) && w) {
    const rows = occupied(w).filter(x => x.status === "critic");
    return rows.length ? "Necesită supraveghere: " + rows.map(x => x.last + " " + x.first).join(", ") + "." : "Niciun pacient critic pe această secție.";
  }
  if (p && /rezum|evolu|foa/.test(s)) {
    const notes = (p.notes || []).slice().sort((a, b) => a.at.localeCompare(b.at));
    const last = notes[notes.length - 1];
    return last ? last.text : "Nu există încă o evoluție pe foaie.";
  }
  if (p && /invest|analiz|imag/.test(s)) {
    const list = (p.studies || []).map(st => st.title + (st.status === "finalizat" ? "" : " (în lucru)"));
    return list.length ? list.join(" · ") : "Nu sunt investigații pe foaie.";
  }
  if (p && /medic/.test(s)) {
    const meds = (p.meds || []).map(m => m.name);
    return meds.length ? "Pe foaie: " + meds.join(", ") + "." : "Nu este trecută medicație pe această foaie.";
  }
  if (w && ui.page === "ward") {
    const view = ui.view === "saloane" ? "saloane" : ui.view === "magazie" ? "magazie" : ui.view === "statistica" ? "statistică" : "lista de pacienți";
    return `Sunteți la ${w.name}, pe ${view}. ${occupied(w).length} internați și ${freeBeds(w).length} paturi libere.`;
  }
  return "Pot vorbi despre secții, paturi libere, pacienți critici, stoc și foaia deschisă.";
}

function patientEpisodes(p) {

function val(id) { return document.getElementById(id)?.value.trim() || ""; }
function dischargeFields(p, w) {

    patientId: p.id,
    dx: cards.dx || p.dx,
    secondary: cards.secondary || "",
    history: cards.history || "",
    epicrisis: cards.epic || epicrisis(p, w),
    studies: cards.studies || "",
    treatment: cards.treat || "",
    state: cards.state || "",
    recommendations: cards.recs || RECS[w.focus] || RECS.general
  };
  return {
    patientId: p.id,
    dx: val("dx-out") || p.dx,
    secondary: val("dx-sec"),
    epicrisis: val("epic") || epicrisis(p, w),
    recommendations: val("recs") || RECS[w.focus] || RECS.general

function commitDischarge() {
  const w = ward(), p = patient();
  if (!w || !p || p.status === "externat") return;
  const fields = dischargeFields(p, w);
  if (!fields.dx || !fields.epicrisis || !fields.recommendations) { toast("Completați diagnosticul, epicriza și recomandările.", "err"); return; }
  p.letter = { number: "SM-" + todayKey().replace(/-/g, "") + "-" + p.fileNo.slice(-3), issued: nowStamp(), dx: fields.dx, secondary: fields.secondary, history: fields.history || "", epicrisis: fields.epicrisis, studies: fields.studies || "", treatment: fields.treatment || "", state: fields.state || "", recommendations: fields.recommendations };

  p.dx = fields.dx;

  p.secondary = fields.secondary || p.secondary;
  p.status = "externat";
  p.discharged = p.letter.issued;
  const bed = p.bed;

  w.patients = w.patients.filter(x => x.id !== p.id);

function systemRoster() {
  const seen = new Map();
  (state.wards || []).forEach(w => {
    [...(w.discharged || []), ...(w.patients || [])].forEach(p => {
      if (p.cnp && !seen.has(p.cnp)) seen.set(p.cnp, p);
    });
  });
  return [...seen.values()];
}
function loadFromSystem() {
  const roster = systemRoster();
  const typed = (document.getElementById("adm-cnp")?.value || "").trim();
  let person = /^\d{13}$/.test(typed) ? roster.find(p => p.cnp === typed) : null;
  if (!person) {
    const live = new Set();
    (state.wards || []).forEach(w => (w.patients || []).forEach(p => live.add(p.cnp)));
    const pool = roster.filter(p => p.cnp && !live.has(p.cnp));
    const list = pool.length ? pool : roster;
    if (!list.length) { toast("Sistemul nu are încă o persoană de încărcat.", "err"); return; }
    person = list[(ui.admitPick || 0) % list.length];
    ui.admitPick = (ui.admitPick || 0) + 1;
  }
  const set = (id, value) => { const el = document.getElementById(id); if (el && value != null && value !== "") el.value = value; };
  const parsed = parseCnp(person.cnp || "");
  set("adm-last", person.last);
  set("adm-first", person.first);
  set("adm-cnp", person.cnp);
  set("adm-birth", parsed.ok ? parsed.iso : String(person.birth || "").slice(0, 10));
  set("adm-sex", parsed.ok ? parsed.sex : person.sex);
  set("adm-phone", person.phone || "");
  set("adm-addr", person.address || "");
  set("adm-alg", person.allergies || "Nu se cunosc");
  set("adm-blood", person.blood || "Necunoscută");
  set("adm-casa", person.casa || "CJAS Bihor");
  set("adm-type", person.type || "Urgență");
  const w = ward();
  const dxList = (w && DX[w.focus]) || DX.general;
  const known = dxList.find(d => String(person.dx || "").startsWith(d[0]));
  set("adm-dx", known ? known[0] + " " + known[1] : (person.dx || dxList[0][0] + " " + dxList[0][1]));

  if (md && person.physician && [...md.options].some(o => o.value === person.physician)) md.value = person.physician;

  if (ins) ins.checked = person.insured !== false;

  toast("Date încărcate din sistem · " + person.last + " " + person.first + ".");
}
function nextFileNo(w) {

  const tag = String(w.tag || w.id || "SEC").slice(0, 3).toUpperCase();
  let max = 0;
  [...(w.patients || []), ...(w.discharged || [])].forEach(p => {

      try { rec.start(); } catch (err) { finish(heardFor(key), "Dictare demonstrativă. Apăsați Corectează."); }
      clearTimeout(micTimer);
      micTimer = setTimeout(() => { if (!settled && el.isConnected) { try { rec.stop(); } catch (err) {} finish(heardFor(key), "Nu s-a auzit voce. Zena a pus o dictare demonstrativă."); } }, 4000);
    }
  }
  if (act === "letter-fix") {
    const key = el.dataset.key;
    const before = (ui.letterDraft && ui.letterDraft.cards[key]) || "";
    const after = zenaPolish(before);
    writeLetterField(key, after, !before.trim() ? "Cardul este gol. Dictați sau reluați din foaie." : after === before ? "Zena a verificat. Textul era deja în regulă." : "Zena a corectat diacriticele și formularea.");
  }
  if (act === "letter-reset") { ui.letterDraft = null; go({ tab: "externare", compose: false }); }
  if (act === "preview") {
    const w = ward(), p = patient();
    ui.draft = dischargeFields(p, w);
    go({ page: "letter" }, true);
  }
  if (act === "emit") commitDischarge();
  if (act === "open-letter") go({ page: "letter", wardId: el.dataset.id, patientId: el.dataset.pid, draft: null }, true);
  if (act === "print") { document.body.classList.add("printing"); window.print(); document.body.classList.remove("printing"); }
  if (act === "save-ward") saveWard();
  if (act === "reset") { sessionStorage.removeItem(KEY); location.reload(); }
});
document.body.addEventListener("input", e => {
  const id = e.target.id;
  if (e.target.classList && e.target.classList.contains("let-field") && ui.letterDraft) {
    ui.letterDraft.cards[e.target.dataset.key] = e.target.value;
    return;
  }
  if (id === "zena-q") { ui.zenaDraft = e.target.value; return; }
  if (id === "hist-q") {
    ui.histQuery = e.target.value;
    const top = document.querySelector(".hist-body")?.scrollTop || 0;
    render();
    const body = document.querySelector(".hist-body");
    if (body) body.scrollTop = top;
    const input = document.getElementById("hist-q");
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    return;
  }
  if (id !== "ward-q" && id !== "med-q" && id !== "mag-q" && id !== "cat-q") return;
  if (id === "ward-q") ui.query = e.target.value;
  if (id === "med-q") ui.medQuery = e.target.value;
  if (id === "mag-q") ui.magQuery = e.target.value;
  if (id === "cat-q") ui.studyQuery = e.target.value;
  const top = document.querySelector(".content")?.scrollTop || 0;
  render();
  const content = document.querySelector(".content");
  if (content) content.scrollTop = top;
  const input = document.getElementById(id);
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "zena-q") { e.preventDefault(); zenaAsk(e.target.value); return; }
  if (e.key === "Enter" && e.target.id === "ai-q") { e.preventDefault(); aiConfigure(e.target.value); return; }
  if (e.key !== "Escape") return;
  if (ui.histOpen) { go({ histOpen: false, histDoc: "" }); return; }
  if (ui.zenaOpen) { go({ zenaOpen: false }); return; }
  if (ui.page === "letter" && ui.draft) go({ page: "patient", tab: "externare" }, true);
  else if (ui.page === "letter" || ui.page === "discharges") go({ page: ui.wardId ? "ward" : "home" }, true);
  else if (ui.page === "patient" || ui.page === "admit" || ui.page === "new-ward" || ui.page === "protocol") go({ page: ui.wardId ? "ward" : "home" }, true);
});
render();
</script>
